name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.100.0'

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh fish shellcheck
          sudo apt-get install --no-install-recommends --yes python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 python3-pyatspi at-spi2-core dbus-daemon libglib2.0-bin xvfb xauth xdotool openbox
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Validate workflow and shell driver
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" \
            --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/check.sh
      - name: Cache downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Check client
        run: scripts/check.sh
      - name: Exercise the Claude Code goal recovery plugin with a synthetic host
        run: cargo test --locked -p gent-link babysitter_installed_plugin_and_native_transcript -- --ignored
      - name: Exercise the Linux tray in a disposable graphical session
        run: |
          dbus-run-session -- xvfb-run -a sh -c '
            openbox &
            exec /usr/bin/python3 scripts/smoke_desktop_linux.py target/debug/gent'
