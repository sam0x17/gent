[workspace]
members = ["crates/gent-protocol", "crates/gent-crypto", "crates/gent-daemon", "crates/gent-link"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
publish = ["crates-io"]
repository = "https://github.com/sam0x17/gent"
homepage = "https://gent.link"
license = "BSD-3-Clause"

[workspace.dependencies]
gent-protocol = { path = "crates/gent-protocol", version = "=0.1.1" }
gent-crypto = { path = "crates/gent-crypto", version = "=0.1.1" }
gent-daemon = { path = "crates/gent-daemon", version = "=0.1.1" }
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
fs2 = "0.4"
getrandom = { version = "0.4", features = ["std"] }
rmcp = { version = "3.10", features = ["transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
httpdate = "1"
openmls = "0.9.2"
openmls_rust_crypto = "0.6"
openmls_sqlite_storage = "0.3"
openmls_traits = "0.6"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
