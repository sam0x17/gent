[package]
name = "gent-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local daemon, storage and synchronization for Gent chat clusters."
include = ["/src/**", "/LICENSE", "/NOTICE.md", "/tests/**", "/examples/**"]

[features]
# Used only in disposable native integration-test builds.
test-entitlements = []

[dependencies]
gent-crypto = { workspace = true, features = ["mls", "invitation"] }
gent-protocol = { workspace = true }
anyhow.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
fs2.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_sqlite_storage.workspace = true
openmls_traits.workspace = true
rustix = { workspace = true, features = ["process"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true
zstd = { version = "0.13", default-features = false }
reqwest.workspace = true
futures-util.workspace = true
httpdate.workspace = true
tokio-tungstenite.workspace = true
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "unstable-net-report", "metrics"] }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server", "tls-ring"] }
noq = { version = "=1.5.0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
netdev = "0.47"
http = "1"
http-body = "1"
http-body-util = "0.1"
getrandom.workspace = true
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"

[dev-dependencies]
# Workspace integration tests enable the fixture feature on this crate. Cargo
# omits this path-only self dependency when preparing the registry package.
gent-daemon = { path = ".", features = ["test-entitlements"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
