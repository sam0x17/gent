[package]
name = "gent-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
mls = ["dep:openmls_traits"]
invitation = ["dep:snow", "dep:url", "dep:x25519-dalek"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
gent-protocol = { path = "../gent-protocol" }
getrandom.workspace = true
openmls_traits = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
snow = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
x25519-dalek = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["rng-getrandom"] }

[lints]
workspace = true
