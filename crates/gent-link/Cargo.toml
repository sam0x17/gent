[package]
name = "gent-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "gent"
path = "src/main.rs"

[features]
# Local auth proof only; rejects overrides unless both origins are loopback.
test-auth-provider = []

[dependencies]
toml.workspace = true
gent-protocol = { path = "../gent-protocol" }
gent-daemon = { path = "../gent-daemon" }
gent-crypto = { path = "../gent-crypto", features = ["invitation"] }
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.6"
fs2.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
zeroize.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml_edit = { version = "0.25", features = ["serde"] }
jsonc-parser = { version = "0.34", features = ["cst"] }
rustix = { version = "1", features = ["process"] }
reqwest.workspace = true
getrandom.workspace = true

[lints]
workspace = true
