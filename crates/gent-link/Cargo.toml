[package]
name = "gent-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "gent"
path = "src/main.rs"

[features]
# Local auth proof only; rejects overrides unless both origins are loopback.
test-auth-provider = []
# Disposable hosted connector proofs with a loopback relay and bridge.
test-web-bridge = []
# Disposable updater proofs only. Never bless or deploy this feature.
test-updates = []

[dependencies]
toml.workspace = true
gent-protocol = { path = "../gent-protocol" }
gent-daemon = { path = "../gent-daemon" }
gent-crypto = { path = "../gent-crypto", features = ["invitation"] }
anyhow.workspace = true
# 0.12's unused ML-KEM backend conflicts with the MLS stack's stable kem API.
# The standard age X25519 stream format used for backups is unchanged.
age = { version = "0.11.5", default-features = false }
rusqlite.workspace = true
clap.workspace = true
clap_complete = "4.6"
fs2.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = { version = "0.18", default-features = false }
subtle = "2"
hmac = "0.12"
ring = "0.17"
tokio-util = "0.7"
url.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
zeroize.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
shlex = "2"
tempfile.workspace = true
toml_edit = { version = "0.25", features = ["serde"] }
jsonc-parser = { version = "0.34", features = ["cst"] }
rustix = { version = "1", features = ["fs", "process"] }
reqwest.workspace = true
getrandom.workspace = true

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
